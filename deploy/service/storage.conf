# Optional drop-in for an operator-managed Compose systemd unit.
# Replace my-library.service with your unit and /srv with the actual storage
# mountpoint (not just an instance directory), in both directives below.
# Install as /etc/systemd/system/my-library.service.d/storage.conf.
[Unit]
RequiresMountsFor=/srv/my-library

[Service]
ExecStartPre=/usr/bin/mountpoint -q /srv

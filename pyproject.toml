[build-system]
requires = ["setuptools>=84.2.1", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "meme-arsenal"
version = "0.1.1"
description = "Incremental Telegram Saved Messages meme importer with AI metadata and static dashboard export."
readme = "README.md"
license = "0BSD"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.20.1,<2",
  "fastapi>=0.161.1,<1",
  "imagehash>=4.3.2,<5",
  "itsdangerous>=2.2,<3",
  "openai>=3.37,<4",
  "pillow>=13.0,<14",
  "psycopg[binary]>=3.3.6,<4",
  "pydantic>=2.14.1,<3",
  "python-dotenv>=1.2.4,<2",
  "python-multipart>=0.0.32,<1",
  "pyyaml>=6.0.3,<7",
  "redis>=8.1,<9",
  "rich>=15.0,<16",
  "sqlalchemy>=2.1.6,<3",
  "telethon>=1.45,<2",
  "typer>=0.27.3,<1",
  "uvicorn[standard]>=0.54,<1",
]

[project.optional-dependencies]
browser = ["playwright>=1.64.1,<2"]
dev = [
  "httpx>=0.28.1,<1",
  "pytest>=9.1.1,<10",
  "pytest-cov>=7.1,<8",
  "ruff>=0.17.2,<1",
]
ocr = [
  "pytesseract>=0.3.13",
]

[project.scripts]
arsenal = "meme_arsenal.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "chromium: browser-backed dashboard tests that launch headless Chromium",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Keep CI behavior stable across Ruff releases instead of inheriting changing defaults.
select = ["E4", "E7", "E9", "F"]
